name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests
      - name: Type check (core — blocking)
        run: mypy src/ctxbox/core
      - name: Type check (gui — informational)
        continue-on-error: true
        run: mypy src/ctxbox/gui
      - name: Test (with coverage)
        run: pytest --cov=ctxbox.core --cov-report=term --cov-report=xml
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python }}
          path: coverage.xml
      - name: GUI smoke (offscreen)
        if: matrix.python == '3.11'
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/gui_smoke.py
