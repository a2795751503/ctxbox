[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ctxbox"
version = "0.7.0"
description = "Open-source local manager for all your AI coding assistant contexts: scan, search, edit, copy and inject conversations across Claude Code, Codex, Cursor, Continue and more."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "a2795751503" }]
requires-python = ">=3.10"
keywords = ["ai", "context-manager", "claude-code", "codex", "cursor", "pyside6"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]
dependencies = [
    "pydantic>=2.5",
    "platformdirs>=4.0",
    "charset-normalizer>=3.3",
    "watchdog>=4.0",
]

[project.optional-dependencies]
gui = [
    "PySide6>=6.6",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.8",
    "PySide6>=6.6",
]
all = [
    "PySide6>=6.6",
    "tiktoken>=0.6",
]

[project.scripts]
ctxbox = "ctxbox.cli:main"

[project.gui-scripts]
ctxbox-gui = "ctxbox.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ctxbox = ["gui/resources/**/*"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
ignore_missing_imports = true
strict = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
